<HTML>
<HEAD>
    <META http-equiv="X-UA-Compatible" content="IE=edge" />
    <TITLE>Şifre Programı</TITLE>
    
    <HTA:APPLICATION 
        ID="SifreProgrami"
        APPLICATIONNAME="Sifre Programi"
        BORDER="none"
        BORDERSTYLE="normal"
        CAPTION="no"
        ICON=""
        MAXIMIZEBUTTON="no"
        MINIMIZEBUTTON="no"
        SHOWINTASKBAR="yes"
        SINGLEINSTANCE="yes"
        SYSMENU="no"
        VERSION="1.0"
        WINDOWSTATE="normal"/>

    <STYLE>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a; /* Arka plan koyu, telefon kasası öne çıksın */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* iPHONE KASASI KUTUSU (Tam Görseldeki Mobil Boyut) */
        .phone-container {
            width: 420px;
            height: 820px;
            background-color: #f2f2f7;
            border-radius: 36px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 4px solid #333333;
        }

        /* Görseldeki Üst Bar ve Kapat Düğmesi */
        .phone-header {
            height: 50px;
            background-color: #f2f2f7;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid #e5e5ea;
        }

        .header-title {
            font-size: 20px;
            font-weight: 800;
            color: #000000;
            letter-spacing: 1px;
        }

        .close-btn {
            background-color: #e53e3e;
            color: white;
            font-weight: bold;
            font-size: 16px;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
        }

        /* 1. GİRİŞ EKRANI */
        .login-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            gap: 20px;
            padding: 20px;
        }

        .img-wrapper img {
            display: block;
            max-width: 160px;
            max-height: 150px;
            object-fit: contain;
        }

        .login-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .login-box input[type="password"] {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            text-align: center;
            width: 80%;
            background-color: #f8fafc;
        }

        .login-box input[type="password"]:focus {
            border-color: #007aff;
            background-color: #ffffff;
        }

        .login-box button {
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background-color: #007aff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 80%;
        }

        .error-msg {
            color: #ff3b30;
            font-size: 14px;
            font-weight: 600;
            height: 18px;
        }

        /* 2. TABLO UYGULAMA EKRANI (Görseldeki İçi Dolu Mobil Düzen) */
        .app-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            padding: 15px;
            gap: 12px;
            background-color: #f2f2f7;
            overflow: hidden;
        }

        /* Mobil Form Giriş Alanı */
        .ios-card-form {
            background: #ffffff;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e5ea;
        }

        .ios-card-form input {
            padding: 10px;
            font-size: 14px;
            border: 1px solid #e5e5ea;
            border-radius: 8px;
            background-color: #f8fafc;
            outline: none;
            text-align: center;
        }

        .ios-card-form button {
            padding: 10px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            background-color: #34c759;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Mobil Tablo Alanı */
        .ios-table-container {
            flex: 1;
            overflow-y: auto;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e5e5ea;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border-bottom: 1px solid #e5e5ea;
            padding: 10px 6px;
            text-align: center;
            font-size: 13px;
            color: #1c1c1e;
            word-break: break-all;
        }

        th {
            background-color: #f9f9fb;
            color: #000000;
            font-weight: 700;
            font-size: 12px;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 2px solid #e5e5ea;
        }

        .delete-btn {
            background-color: #ff3b30;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }

        /* Alt Bilgi Barı (Görseldeki Gibi) */
        .phone-footer {
            height: 25px;
            background-color: #e5e5ea;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            font-size: 11px;
            color: #666666;
        }
    </STYLE>

    <SCRIPT LANGUAGE="VBScript">
        Sub Window_OnLoad
            ' Uygulama penceresini tam olarak mobil boyutuna getirir ve ekranda ortalar
            Dim w, h, x, y
            w = 460
            h = 860
            x = (screen.availWidth - w) / 2
            y = (screen.availHeight - h) / 2
            window.resizeTo w, h
            window.moveTo x, y
        End Sub
    </SCRIPT>

    <SCRIPT LANGUAGE="JavaScript">
        function kapatProgram() {
            window.close();
        }

        function sifreKontrol() {
            var girilenSifre = document.getElementById("passInput").value;
            var dogruSifre = "8290028";

            if (girilenSifre === dogruSifre) {
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("appScreen").style.display = "flex";
            } else {
                document.getElementById("errorText").innerText = "Hatalı şifre!";
                document.getElementById("passInput").value = "";
                document.getElementById("passInput").focus();
            }
        }

        function tusKontrol(e) {
            if (e.keyCode === 13) {
                sifreKontrol();
            }
        }

        function satirEkle() {
            var isim = document.getElementById("inputIsim").value;
            var kadi = document.getElementById("inputKadi").value;
            var sifre = document.getElementById("inputSifre").value;

            if (isim === "" || kadi === "" || sifre === "") {
                alert("Lütfen tüm alanları doldurun!");
                return;
            }

            var tbody = document.getElementById("tableBody");
            var newRow = tbody.insertRow();

            var cell1 = newRow.insertCell(0);
            var cell2 = newRow.insertCell(1);
            var cell3 = newRow.insertCell(2);
            var cell4 = newRow.insertCell(3);

            cell1.innerText = isim;
            cell2.innerText = kadi;
            cell3.innerText = sifre;
            cell4.innerHTML = '<button class="delete-btn" onclick="satirSil(this)">Sil</button>';

            document.getElementById("inputIsim").value = "";
            document.getElementById("inputKadi").value = "";
            document.getElementById("inputSifre").value = "";
            document.getElementById("inputIsim").focus();
        }

        function satirSil(btn) {
            var row = btn.parentNode.parentNode;
            row.parentNode.removeChild(row);
        }
    </SCRIPT>
</HEAD>
<BODY>

    <!-- TELEFON ÇERÇEVESİ -->
    <DIV class="phone-container">
        
        <!-- Üst Bar ve Kapat (X) Butonu -->
        <DIV class="phone-header">
            <SPAN class="header-title">ŞİFRE KASASI</SPAN>
            <BUTTON class="close-btn" onclick="kapatProgram()">X</BUTTON>
        </DIV>

        <!-- 1. GİRİŞ EKRANI -->
        <DIV class="login-screen" id="loginScreen">
            <DIV class="img-wrapper">
                <IMG src="https://i.ibb.co/23nVyw8g/MG-2684.jpg" alt="Logo">
            </DIV>

            <DIV class="login-box">
                <INPUT type="password" id="passInput" placeholder="Şifre" onkeypress="tusKontrol(event)" autofocus>
                <BUTTON onclick="sifreKontrol()">Giriş Yap</BUTTON>
                <DIV class="error-msg" id="errorText"></DIV>
            </DIV>
        </DIV>

        <!-- 2. iPHONE MOBİL TABLO EKRANI -->
        <DIV class="app-screen" id="appScreen">
            
            <!-- Ekleme Formu -->
            <DIV class="ios-card-form">
                <INPUT type="text" id="inputIsim" placeholder="İsim (Örn: Hepsiburada)">
                <INPUT type="text" id="inputKadi" placeholder="Kullanıcı Adı / E-posta">
                <INPUT type="text" id="inputSifre" placeholder="Şifre">
                <BUTTON onclick="satirEkle()">Satır Ekle</BUTTON>
            </DIV>

            <!-- Mobil Tablo -->
            <DIV class="ios-table-container">
                <TABLE>
                    <THEAD>
                        <TR>
                            <TH style="width: 30%;">İsim</TH>
                            <TH style="width: 35%;">Kullanıcı Adı</TH>
                            <TH style="width: 23%;">Şifre</TH>
                            <TH style="width: 12%;">Sil</TH>
                        </TR>
                    </THEAD>
                    <TBODY id="tableBody">
                        <TR>
                            <TD>Hepsiburada</TD>
                            <TD>ersibeyhan@gmail.com</TD>
                            <TD>123456</TD>
                            <TD><BUTTON class="delete-btn" onclick="satirSil(this)">Sil</BUTTON></TD>
                        </TR>
                    </TBODY>
                </TABLE>
            </DIV>

        </DIV>

        <!-- Görseldeki Gibi Alt Bilgi Barı -->
        <DIV class="phone-footer">
            <SPAN>Şifre Korumalı</SPAN>
            <SPAN>ErsNByhN® 2026</SPAN>
        </DIV>

    </DIV>

</BODY>
</HTML>
