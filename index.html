<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <title>EB Şifre Paneli</title>
    <HTA:APPLICATION 
        ID="objEBSifreApp"
        APPLICATIONNAME="EBSifreYonetici"
        SCROLL="yes"
        SINGLEINSTANCE="yes"
        WINDOWSTATE="maximize"
        BORDER="none"
    >
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
        }

        /* ----- SAYFA 1: GİRİŞ (DEV LOGO + ŞİFRE) ----- */
        #page-login {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            padding: 20px;
        }
        /* Logoyu dev boyuta getiren kısım */
        .logo-img-huge {
            width: 90vw;
            height: 70vh;
            object-fit: contain;
            margin-bottom: 20px;
        }
        .login-box {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .input-password {
            width: 100%;
            padding: 16px;
            font-size: 22px;
            border: 3px solid #000000;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 12px;
            outline: none;
            letter-spacing: 3px;
            font-weight: bold;
        }
        .input-password:focus {
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: #000000;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #333333;
        }
        .error-message {
            color: #d9534f;
            font-weight: bold;
            margin-top: 10px;
            display: none;
            font-size: 18px;
        }

        /* ----- SAYFA 2: ÇİZİME UYGUN 3 SÜTUNLU ŞİFRE TABLOSU ----- */
        #page-vault {
            display: none;
            width: 100vw;
            min-height: 100vh;
            padding: 20px;
            background-color: #ffffff;
        }
        .vault-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #000;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .vault-header h1 {
            color: #000;
            font-size: 26px;
            font-weight: 800;
        }
        .btn-lock {
            padding: 10px 20px;
            background-color: #c0392b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        /* 3 Sütunlu Çizim Izgarası */
        .grid-3-columns {
            display: flex;
            gap: 15px;
            width: 100%;
            border: 3px solid #000;
            padding: 10px;
            background-color: #fff;
        }
        .column-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: 2px solid #000;
            padding: 8px;
            background-color: #fafafa;
        }
        .column-title {
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            background-color: #000;
            color: #fff;
            padding: 8px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        /* Şifrelerinizi yazacağınız satırlar */
        .pass-input-row {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #000;
            border-radius: 3px;
            background-color: #ffffff;
            outline: none;
        }
        .pass-input-row:focus {
            background-color: #eef7ff;
            border-color: #0056b3;
        }
    </style>

    <script language="JavaScript">
        function girisYap() {
            var girilen = document.getElementById("txtPass").value;
            if (girilen === "8290028") {
                document.getElementById("page-login").style.display = "none";
                document.getElementById("page-vault").style.display = "block";
                document.getElementById("lblError").style.display = "none";
            } else {
                document.getElementById("lblError").style.display = "block";
                document.getElementById("txtPass").value = "";
                document.getElementById("txtPass").focus();
            }
        }

        function keyCheck(e) {
            var key = e.keyCode || e.which;
            if (key === 13) {
                girisYap();
            }
        }

        function cikisYap() {
            document.getElementById("txtPass").value = "";
            document.getElementById("page-vault").style.display = "none";
            document.getElementById("page-login").style.display = "flex";
            document.getElementById("lblError").style.display = "none";
            document.getElementById("txtPass").focus();
        }
    </script>
</head>
<body>

    <!-- SAYFA 1: GİRİŞ (DEV LOGO) -->
    <div id="page-login">
        <!-- Ekranı kaplayan dev logonuz -->
        <img src="https://i.ibb.co/mFNgxpdC/icon-192.png" alt="EB Logo" class="logo-img-huge" />
        
        <div class="login-box">
            <input type="password" id="txtPass" class="input-password" placeholder="ŞİFRE" onkeypress="keyCheck(event)" />
            <button class="btn-submit" onclick="girisYap()">GİRİŞ YAP</button>
            <div id="lblError" class="error-message">Hatalı Şifre!</div>
        </div>
    </div>

    <!-- SAYFA 2: ÇİZİME UYGUN ŞİFRE YAZMA ALANI (3 SÜTUN) -->
    <div id="page-vault">
        <div class="vault-header">
            <h1>ŞİFRELERİM</h1>
            <button class="btn-lock" onclick="cikisYap()">KİLİTLE</button>
        </div>

        <div class="grid-3-columns">
            <!-- 1. SÜTUN -->
            <div class="column-box">
                <div class="column-title">1. BÖLÜM</div>
                <input type="text" class="pass-input-row" placeholder="1. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="2. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="3. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="4. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="5. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="6. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="7. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="8. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="9. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="10. Şifre Kaydı..." />
            </div>

            <!-- 2. SÜTUN -->
            <div class="column-box">
                <div class="column-title">2. BÖLÜM</div>
                <input type="text" class="pass-input-row" placeholder="1. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="2. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="3. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="4. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="5. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="6. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="7. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="8. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="9. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="10. Şifre Kaydı..." />
            </div>

            <!-- 3. SÜTUN -->
            <div class="column-box">
                <div class="column-title">3. BÖLÜM</div>
                <input type="text" class="pass-input-row" placeholder="1. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="2. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="3. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="4. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="5. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="6. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="7. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="8. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="9. Şifre Kaydı..." />
                <input type="text" class="pass-input-row" placeholder="10. Şifre Kaydı..." />
            </div>
        </div>
    </div>

</body>
</html>
