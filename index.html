<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <title>EB Vault</title>
    <HTA:APPLICATION 
        ID="objEBSifreApp"
        APPLICATIONNAME="EBSifreYonetici"
        SCROLL="yes"
        SINGLEINSTANCE="yes"
        WINDOWSTATE="maximize"
        BORDER="none"
    >
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
        }

        /* ----- SAYFA 1: GİRİŞ (YÜKSEK ÇÖZÜNÜRLÜKLÜ DEV LOGO + ŞİFRE) ----- */
        #page-login {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            padding: 20px;
        }
        .logo-img {
            max-width: 90vw;
            max-height: 65vh;
            width: auto;
            height: auto;
            object-fit: contain;
            margin-bottom: 25px;
        }
        .login-box {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .input-password {
            width: 100%;
            padding: 15px;
            font-size: 22px;
            border: 2px solid #000000;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 12px;
            outline: none;
            font-weight: bold;
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background-color: #000000;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #333333;
        }
        .error-message {
            color: #d9534f;
            font-weight: bold;
            margin-top: 10px;
            display: none;
            font-size: 16px;
        }

        /* ----- SAYFA 2: BİREBİR EXCEL TABLOSU (HİÇBİR YAZI YOK) ----- */
        #page-vault {
            display: none;
            width: 100vw;
            min-height: 100vh;
            padding: 20px;
            background-color: #e6e6e6; /* Excel arka plan rengi */
        }
        .excel-table-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 2px solid #000000;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .excel-grid {
            display: table;
            width: 100%;
            border-collapse: collapse;
        }
        .excel-row {
            display: table-row;
        }
        .excel-cell {
            display: table-cell;
            width: 33.33%;
            border: 1px solid #7f7f7f;
            padding: 0;
            background-color: #ffffff;
        }
        .excel-cell input {
            width: 100%;
            height: 32px;
            border: none;
            outline: none;
            padding: 4px 8px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            background: transparent;
        }
        .excel-cell input:focus {
            background-color: #e8f2fe;
            box-shadow: inset 0 0 0 2px #107c41; /* Excel yeşil odaklama kenarlığı */
        }
    </style>

    <script language="JavaScript">
        function girisYap() {
            var girilen = document.getElementById("txtPass").value;
            if (girilen === "8290028") {
                document.getElementById("page-login").style.display = "none";
                document.getElementById("page-vault").style.display = "block";
                document.getElementById("lblError").style.display = "none";
            } else {
                document.getElementById("lblError").style.display = "block";
                document.getElementById("txtPass").value = "";
                document.getElementById("txtPass").focus();
            }
        }

        function keyCheck(e) {
            var key = e.keyCode || e.which;
            if (key === 13) {
                girisYap();
            }
        }
    </script>
</head>
<body>

    <!-- SAYFA 1: GİRİŞ (NET VE DEV LOGO) -->
    <div id="page-login">
        <!-- Güncellenen Yüksek Çözünürlüklü Logo Bağlantısı -->
        <img src="https://i.ibb.co/wNscSJQY/icon-192.png" alt="EB Logo" class="logo-img" onerror="this.src='https://i.ibb.co/mFNgxpdC/icon-192.png';" />
        
        <div class="login-box">
            <input type="password" id="txtPass" class="input-password" placeholder="Şifrenizi Girin" onkeypress="keyCheck(event)" />
            <button class="btn-submit" onclick="girisYap()">GİRİŞ YAP</button>
            <div id="lblError" class="error-message">Hatalı Şifre!</div>
        </div>
    </div>

    <!-- SAYFA 2: SADECE SÜTUN VE SATIRLARDAN OLUŞAN BOŞ TABLO -->
    <div id="page-vault">
        <div class="excel-table-container">
            <div class="excel-grid">
                <!-- 30 Satırlık Boş Hücre Ağı (İstediğiniz kadar veri yazabilirsiniz) -->
                <script language="JavaScript">
                    for (var i = 0; i < 35; i++) {
                        document.write('<div class="excel-row">');
                        document.write('  <div class="excel-cell"><input type="text" /></div>');
                        document.write('  <div class="excel-cell"><input type="text" /></div>');
                        document.write('  <div class="excel-cell"><input type="text" /></div>');
                        document.write('</div>');
                    }
                </script>
            </div>
        </div>
    </div>

</body>
</html>
