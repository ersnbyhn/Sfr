<HTML>
<HEAD>
    <TITLE>Şifre Programı</TITLE>
    <HTA:APPLICATION 
        ID="SifreProgrami"
        APPLICATIONNAME="Sifre Programi"
        BORDER="none"
        BORDERSTYLE="normal"
        CAPTION="no"
        ICON=""
        MAXIMIZEBUTTON="no"
        MINIMIZEBUTTON="no"
        SHOWINTASKBAR="yes"
        SINGLEINSTANCE="yes"
        SYSMENU="no"
        VERSION="1.0"
        WINDOWSTATE="maximize"/>

    <STYLE>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .main-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 24px;
        }

        /* Logo hiçbir şekilde küçültülmez / boyutlandırılmaz */
        .img-wrapper img {
            display: block;
        }

        /* Şifre Giriş Alanı */
        .login-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .login-box input[type="password"] {
            padding: 10px 16px;
            font-size: 16px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            text-align: center;
            width: 200px;
        }

        .login-box input[type="password"]:focus {
            border-color: #0284c7;
        }

        .login-box button {
            padding: 10px 24px;
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            background-color: #0284c7;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .login-box button:hover {
            background-color: #0369a1;
        }

        .error-msg {
            color: #ef4444;
            font-size: 14px;
            height: 18px;
        }
    </STYLE>

    <SCRIPT LANGUAGE="VBScript">
        Sub Window_OnLoad
            window.resizeTo screen.availWidth, screen.availHeight
            window.moveTo 0, 0
        End Sub
    </SCRIPT>

    <SCRIPT LANGUAGE="JavaScript">
        function sifreKontrol() {
            var girilenSifre = document.getElementById("passInput").value;
            var dogruSifre = "8290028";

            if (girilenSifre === dogruSifre) {
                // Şifre doğruysa ekranı tamamen temizle
                document.body.innerHTML = "";
            } else {
                // Şifre yanlışsa uyarı mesajı göster
                document.getElementById("errorText").innerText = "Hatalı şifre!";
                document.getElementById("passInput").value = "";
                document.getElementById("passInput").focus();
            }
        }

        function tusKontrol(e) {
            // Enter tuşuna basıldığında da kontrol et
            if (e.keyCode === 13) {
                sifreKontrol();
            }
        }
    </SCRIPT>
</HEAD>
<BODY>

    <DIV class="main-container" id="contentArea">
        <DIV class="img-wrapper">
            <IMG src="https://i.ibb.co/23nVyw8g/MG-2684.jpg" alt="MG-2684">
        </DIV>

        <DIV class="login-box">
            <INPUT type="password" id="passInput" placeholder="Şifre" onkeypress="tusKontrol(event)" autofocus>
            <BUTTON onclick="sifreKontrol()">Giriş</BUTTON>
            <DIV class="error-msg" id="errorText"></DIV>
        </DIV>
    </DIV>

</BODY>
</HTML>
