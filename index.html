<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <title>EB Şifre Paneli</title>
    <HTA:APPLICATION 
        ID="objEBSifreApp"
        APPLICATIONNAME="EBSifreYonetici"
        SCROLL="no"
        SINGLEINSTANCE="yes"
        WINDOWSTATE="maximize"
        BORDER="none"
    >
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* ----- SAYFA 1: GİRİŞ (TAM EKRAN EB LOGOSU) ----- */
        #page-login {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            padding: 20px;
        }
        .logo-img {
            max-width: 80vw;
            max-height: 55vh;
            object-fit: contain;
            margin-bottom: 30px;
        }
        .login-box {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .input-password {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            border: 2px solid #111111;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
            letter-spacing: 2px;
        }
        .input-password:focus {
            border-color: #000000;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background-color: #111111;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #333333;
        }
        .error-message {
            color: #d9534f;
            font-weight: bold;
            margin-top: 12px;
            display: none;
            font-size: 16px;
        }

        /* ----- SAYFA 2: ŞİFRELERİM (3 EŞİT SÜTUN) ----- */
        #page-vault {
            display: none;
            width: 100vw;
            height: 100vh;
            padding: 20px;
            background-color: #f4f6f9;
        }
        .vault-header {
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ccc;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .vault-header h1 {
            color: #111111;
            font-size: 24px;
        }
        .grid-3-col {
            display: flex;
            gap: 15px;
            height: calc(100vh - 105px);
            width: 100%;
        }
        .column {
            flex: 1;
            background: #ffffff;
            border: 2px solid #111111;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
        }
        .column-header {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            background-color: #111111;
            color: white;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .data-row {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
        }
        .data-row strong {
            display: block;
            color: #555;
            font-size: 12px;
        }
        .data-row span {
            font-size: 15px;
            font-weight: bold;
            color: #222;
        }
        .btn-lock {
            padding: 8px 16px;
            background-color: #c0392b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>

    <script language="JavaScript">
        function girisYap() {
            var girilen = document.getElementById("txtPass").value;
            if (girilen === "8290028") {
                document.getElementById("page-login").style.display = "none";
                document.getElementById("page-vault").style.display = "block";
                document.getElementById("lblError").style.display = "none";
            } else {
                document.getElementById("lblError").style.display = "block";
                document.getElementById("txtPass").value = "";
                document.getElementById("txtPass").focus();
            }
        }

        function keyCheck(e) {
            var key = e.keyCode || e.which;
            if (key === 13) {
                girisYap();
            }
        }

        function cikisYap() {
            document.getElementById("txtPass").value = "";
            document.getElementById("page-vault").style.display = "none";
            document.getElementById("page-login").style.display = "flex";
            document.getElementById("lblError").style.display = "none";
            document.getElementById("txtPass").focus();
        }
    </script>
</head>
<body>

    <!-- SAYFA 1: LOGIN -->
    <div id="page-login">
        <!-- İnternetteki Logonuzun Doğrudan Bağlantısı -->
        <img src="https://i.ibb.co/6y4pQf1/eb-logo.png" alt="EB Logo" class="logo-img" />
        
        <div class="login-box">
            <input type="password" id="txtPass" class="input-password" placeholder="Şifrenizi Girin" onkeypress="keyCheck(event)" />
            <button class="btn-submit" onclick="girisYap()">GİRİŞ YAP</button>
            <div id="lblError" class="error-message">Hatalı Şifre! Lütfen Tekrar Deneyin.</div>
        </div>
    </div>

    <!-- SAYFA 2: ŞİFRELERİM (3 EŞİT SÜTUN) -->
    <div id="page-vault">
        <div class="vault-header">
            <h1>ŞİFRELERİM</h1>
            <button class="btn-lock" onclick="cikisYap()">KİLİTLE</button>
        </div>

        <div class="grid-3-col">
            <!-- 1. SÜTUN -->
            <div class="column">
                <div class="column-header">ÖNEMLİ HESAPLAR</div>
                <div class="data-row">
                    <strong>E-Posta:</strong>
                    <span>ornek@gmail.com</span>
                </div>
                <div class="data-row">
                    <strong>Banka Şifresi:</strong>
                    <span>123456</span>
                </div>
            </div>

            <!-- 2. SÜTUN -->
            <div class="column">
                <div class="column-header">İŞ VE PROJELER</div>
                <div class="data-row">
                    <strong>İş Postası:</strong>
                    <span>is@sirket.com</span>
                </div>
                <div class="data-row">
                    <strong>Sunucu Girişi:</strong>
                    <span>Admin_2026</span>
                </div>
            </div>

            <!-- 3. SÜTUN -->
            <div class="column">
                <div class="column-header">DİĞER KAYITLAR</div>
                <div class="data-row">
                    <strong>Wi-Fi Şifresi:</strong>
                    <span>Wifi123456</span>
                </div>
                <div class="data-row">
                    <strong>Sosyal Medya:</strong>
                    <span>@kullanici</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
