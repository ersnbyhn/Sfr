<HTML>
<HEAD>
    <TITLE>Şifre Programı</TITLE>
    <HTA:APPLICATION 
        ID="SifreProgrami"
        APPLICATIONNAME="Sifre Programi"
        BORDER="none"
        BORDERSTYLE="normal"
        CAPTION="no"
        ICON=""
        MAXIMIZEBUTTON="no"
        MINIMIZEBUTTON="no"
        SHOWINTASKBAR="yes"
        SINGLEINSTANCE="yes"
        SYSMENU="no"
        VERSION="1.0"
        WINDOWSTATE="maximize"/>

    <STYLE>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff; /* Arka plan tamamen beyaz */
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .main-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .img-wrapper img {
            display: block;
            /* Resmin büyük görünmesi için ekran boyutuna oranlandı */
            width: 80vw;           /* Ekran genişliğinin %80'ini kaplar */
            max-height: 85vh;      /* Ekran yüksekliğinin %85'ini aşmaz */
            object-fit: contain;   /* Resmin oranını bozmadan büyümesini sağlar */
        }
    </STYLE>

    <SCRIPT LANGUAGE="VBScript">
        Sub Window_OnLoad
            window.resizeTo screen.availWidth, screen.availHeight
            window.moveTo 0, 0
        End Sub
    </SCRIPT>
</HEAD>
<BODY>

    <DIV class="main-container">
        <DIV class="img-wrapper">
            <IMG src="https://i.ibb.co/23nVyw8g/MG-2684.jpg" alt="MG-2684">
        </DIV>
    </DIV>

</BODY>
</HTML>
