<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Programı</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Tüm ekranı kaplayacak tam yükseklik */
            min-height: 100vh;
            background-color: #0f172a; /* Şifre arayüzüne uygun koyu arka plan */
            
            /* İçeriği dikey ve yatayda tam merkeze hizalama */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
        }

        .image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .image-container img {
            /* Görselin orijinal boyutunda görünmesi için */
            max-width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="image-container">
        <img src="https://ibb.co/ZzL4V3HW" alt="Şifre Programı">
    </div>

</body>
</html>
