<HTML>
<HEAD>
    <TITLE>Şifre Programı</TITLE>
    <HTA:APPLICATION 
        ID="SifreProgrami"
        APPLICATIONNAME="Sifre Programi"
        BORDER="none"
        BORDERSTYLE="normal"
        CAPTION="no"
        ICON=""
        MAXIMIZEBUTTON="no"
        MINIMIZEBUTTON="no"
        SHOWINTASKBAR="yes"
        SINGLEINSTANCE="yes"
        SYSMENU="no"
        VERSION="1.0"
        WINDOWSTATE="maximize"/>

    <STYLE>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Ekranın yakınlaşmasını ve boyut değiştirmesini engeller */
            touch-action: manipulation;
            -ms-content-zooming: none;
        }

        /* 1. GİRİŞ EKRANI */
        .login-screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            gap: 20px;
        }

        .img-wrapper img {
            display: block;
            max-width: 220px;
            max-height: 200px;
            height: auto;
            object-fit: contain;
        }

        .login-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .login-box input[type="password"] {
            padding: 10px 16px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            text-align: center;
            width: 240px;
            background-color: #f8fafc;
        }

        .login-box input[type="password"]:focus {
            border-color: #007aff;
            background-color: #ffffff;
        }

        .login-box button {
            padding: 10px 24px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            background-color: #007aff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 240px;
        }

        .login-box button:hover {
            background-color: #0056b3;
        }

        .error-msg {
            color: #ff3b30;
            font-size: 14px;
            font-weight: 600;
            height: 18px;
        }

        /* 2. iPHONE APP EKRANI */
        .app-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            background-color: #f2f2f7;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 15px;
        }

        .app-header {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .app-header h1 {
            font-size: 22px;
            color: #000000;
            font-weight: 700;
        }

        /* Form Kartı */
        .ios-card-form {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .ios-card-form input {
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #e5e5ea;
            border-radius: 8px;
            flex: 1;
            background-color: #f2f2f7;
            outline: none;
            text-align: center;
        }

        .ios-card-form input:focus {
            background-color: #ffffff;
            border-color: #007aff;
        }

        .ios-card-form button {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            background-color: #34c759;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .ios-card-form button:hover {
            background-color: #28a745;
        }

        /* Tablo Kartı */
        .ios-table-container {
            width: 100%;
            max-width: 800px;
            flex: 1;
            overflow-y: auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border-bottom: 1px solid #e5e5ea;
            padding: 12px 10px;
            text-align: center;
            font-size: 15px;
            color: #1c1c1e;
        }

        th {
            background-color: #f9f9fb;
            color: #8e8e93;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .delete-btn {
            background-color: #ff3b30;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .delete-btn:hover {
            background-color: #d70015;
        }
    </STYLE>

    <SCRIPT LANGUAGE="VBScript">
        Sub Window_OnLoad
            window.resizeTo screen.availWidth, screen.availHeight
            window.moveTo 0, 0
        End Sub
    </SCRIPT>

    <SCRIPT LANGUAGE="JavaScript">
        function sifreKontrol() {
            var girilenSifre = document.getElementById("passInput").value;
            var dogruSifre = "8290028";

            if (girilenSifre === dogruSifre) {
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("appScreen").style.display = "flex";
            } else {
                document.getElementById("errorText").innerText = "Hatalı şifre!";
                document.getElementById("passInput").value = "";
                document.getElementById("passInput").focus();
            }
        }

        function tusKontrol(e) {
            if (e.keyCode === 13) {
                sifreKontrol();
            }
        }

        function satirEkle() {
            var isim = document.getElementById("inputIsim").value;
            var kadi = document.getElementById("inputKadi").value;
            var sifre = document.getElementById("inputSifre").value;

            if (isim === "" || kadi === "" || sifre === "") {
                alert("Lütfen tüm alanları doldurun!");
                return;
            }

            var tbody = document.getElementById("tableBody");
            var newRow = tbody.insertRow();

            var cell1 = newRow.insertCell(0);
            var cell2 = newRow.insertCell(1);
            var cell3 = newRow.insertCell(2);
            var cell4 = newRow.insertCell(3);

            cell1.innerText = isim;
            cell2.innerText = kadi;
            cell3.innerText = sifre;
            cell4.innerHTML = '<button class="delete-btn" onclick="satirSil(this)">Sil</button>';

            document.getElementById("inputIsim").value = "";
            document.getElementById("inputKadi").value = "";
            document.getElementById("inputSifre").value = "";
            document.getElementById("inputIsim").focus();
        }

        function satirSil(btn) {
            var row = btn.parentNode.parentNode;
            row.parentNode.removeChild(row);
        }
    </SCRIPT>
</HEAD>
<BODY>

    <!-- 1. GİRİŞ EKRANI -->
    <DIV class="login-screen" id="loginScreen">
        <DIV class="img-wrapper">
            <IMG src="https://i.ibb.co/23nVyw8g/MG-2684.jpg" alt="MG-2684">
        </DIV>

        <DIV class="login-box">
            <INPUT type="password" id="passInput" placeholder="Şifre" onkeypress="tusKontrol(event)" autofocus>
            <BUTTON onclick="sifreKontrol()">Giriş Yap</BUTTON>
            <DIV class="error-msg" id="errorText"></DIV>
        </DIV>
    </DIV>

    <!-- 2. iPHONE UYGULAMA EKRANI -->
    <DIV class="app-screen" id="appScreen">
        
        <DIV class="app-header">
            <H1>Şifre Kasası</H1>
        </DIV>

        <!-- iOS Form Kartı -->
        <DIV class="ios-card-form">
            <INPUT type="text" id="inputIsim" placeholder="İsim">
            <INPUT type="text" id="inputKadi" placeholder="Kullanıcı Adı">
            <INPUT type="text" id="inputSifre" placeholder="Şifre">
            <BUTTON onclick="satirEkle()">Ekle</BUTTON>
        </DIV>

        <!-- iOS Tablo Kartı -->
        <DIV class="ios-table-container">
            <TABLE>
                <THEAD>
                    <TR>
                        <TH style="width: 30%;">İsim</TH>
                        <TH style="width: 35%;">Kullanıcı Adı</TH>
                        <TH style="width: 25%;">Şifre</TH>
                        <TH style="width: 10%;">İşlem</TH>
                    </TR>
                </THEAD>
                <TBODY id="tableBody">
                    <TR>
                        <TD>Hepsiburada</TD>
                        <TD>ersibeyhan@gmail.com</TD>
                        <TD>123456789</TD>
                        <TD><BUTTON class="delete-btn" onclick="satirSil(this)">Sil</BUTTON></TD>
                    </TR>
                </TBODY>
            </TABLE>
        </DIV>

    </DIV>

</BODY>
</HTML>
